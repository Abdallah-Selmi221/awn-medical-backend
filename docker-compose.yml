services:
  awn-medical-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awn_medical_ai_service
    image: awn-medical-ai:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OOD_CONFIDENCE_THRESHOLD=0.65
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SURVEILLANCE_DEFAULT_INVESTIGATOR=podep8166@gmail.com
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
